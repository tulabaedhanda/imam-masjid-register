<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امام حسین مسجد - پورٹل</title>
    <style>
        :root {
            --primary-color: #800000;
            --secondary-color: #ffd700;
            --bg-light: #fffdf0;
            --accent-blue: #0f4c81;
            --btn-purple: #4a2c91;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #bc1a5f; padding: 10px; display: flex; justify-content: center; }
        .app-container { background-color: var(--bg-light); width: 100%; max-width: 500px; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 4px solid var(--secondary-color); padding-bottom: 20px; }
        .banner { background: linear-gradient(135deg, #4a0000, #800000); padding: 20px; text-align: center; border-bottom: 4px solid var(--secondary-color); }
        .banner h1 { color: var(--secondary-color); font-size: 2.2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; }
        .nav-btn { background: white; border: 2px solid var(--primary-color); border-radius: 10px; padding: 10px 5px; text-align: center; font-weight: bold; color: var(--primary-color); cursor: pointer; font-size: 0.95rem; }
        .nav-btn.active { background: var(--accent-blue); border-color: var(--secondary-color); color: white; }
        .nav-grid-row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 15px 15px 15px; }
        .stats-filter-row { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 15px 20px; }
        .student-count { color: var(--primary-color); font-weight: bold; font-size: 1.2rem; }
        .date-select { padding: 6px 12px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; width: 60%; background: white; font-weight: bold; }
        .table-header { display: grid; grid-template-columns: 1.5fr 4fr 2.5fr; background-color: var(--accent-blue); color: white; text-align: center; font-weight: bold; padding: 10px 5px; font-size: 1.1rem; margin: 0 15px; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .data-list { margin: 0 15px; max-height: 400px; overflow-y: auto; background: white; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; border: 1px solid #ddd; }
        .data-row { display: grid; grid-template-columns: 1.5fr 4fr 2.5fr; text-align: center; padding: 8px 5px; border-bottom: 1px solid #eee; align-items: center; font-size: 1rem; }
        .data-row:nth-child(even) { background-color: #f9f9f9; }
        .status-badge { padding: 4px 8px; border-radius: 5px; font-size: 0.85rem; font-weight: bold; display: inline-block; width: 90%; text-align: center; }
        .present { background-color: #d4edda; color: #155724; }
        .absent { background-color: #f8d7da; color: #721c24; }
        .leave { background-color: #fff3cd; color: #856404; }
        .none { background-color: #e2e3e5; color: #383d41; }
        .footer-action { padding: 15px; text-align: center; }
        .action-btn { background-color: var(--btn-purple); color: white; border: none; padding: 12px 30px; border-radius: 10px; font-size: 1.2rem; font-weight: bold; width: 90%; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="banner">
        <h1>امام حسین مسجد</h1>
    </div>

    <div class="nav-grid">
        <div class="nav-btn active" id="btn-attendance" onclick="switchTab('attendance')">حاضری</div>
        <div class="nav-btn" id="btn-lesson" onclick="switchTab('lesson')">سبق</div>
        <div class="nav-btn" id="btn-diary" onclick="switchTab('diary')">ڈائری</div>
        <div class="nav-btn" id="btn-videos" onclick="switchTab('videos')">ویڈیوز</div>
    </div>
    <div class="nav-grid-row2">
        <div class="nav-btn" id="btn-report_attendance" onclick="switchTab('report_attendance')">حاضری رپورٹ</div>
        <div class="nav-btn" id="btn-report_lesson" onclick="switchTab('report_lesson')">سبق رپورٹ</div>
    </div>

    <div class="stats-filter-row">
        <div class="student-count">تعداد: <span>27</span></div>
        <select class="date-select" id="date-picker" onchange="loadDataForDate()"></select>
    </div>

    <div class="table-header">
        <div>نمبر</div>
        <div>نام طالب علم</div>
        <div id="dynamic-header">حاضری</div>
    </div>

    <div class="data-list" id="students-list"></div>

    <div class="footer-action">
        <button class="action-btn" onclick="window.print()">پی ڈی ایف / پرنٹ</button>
    </div>
</div>

    let currentTab = 'attendance';

    // تاریخوں کو شروع سے آخر تک ترتیب (Sort) دینے کا فنکشن
    function initDatePicker() {
        const picker = document.getElementById('date-picker');
        picker.innerHTML = '';
        
        // تاریخوں کو اسینڈنگ آرڈر (Purani se Nayi) میں ترتیب دینا
        const sortedDates = Object.keys(attendanceData).sort((a, b) => new Date(a) - new Date(b));
        
        sortedDates.forEach(date => {
            const option = document.createElement('option');
            option.value = date;
            option.textContent = date;
            picker.appendChild(option);
        });
    }

    function switchTab(tabName) {
        currentTab = tabName;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${tabName}`).classList.add('active');

        const header = document.getElementById('dynamic-header');
        header.textContent = (tabName === 'lesson') ? 'سبق / دعا' : 'حاضری';

        loadDataForDate();
    }

    function loadDataForDate() {
        const selectedDate = document.getElementById('date-picker').value;
        const listContainer = document.getElementById('students-list');
        listContainer.innerHTML = '';

        if (!selectedDate || !attendanceData[selectedDate]) return;

        const dayData = attendanceData[selectedDate];

        studentNames.forEach((name, index) => {
            const row = document.createElement('div');
            row.className = 'data-row';

            const numDiv = document.createElement('div');
            numDiv.textContent = index + 1;

            const nameDiv = document.createElement('div');
            nameDiv.style.textAlign = 'right';
            nameDiv.style.paddingRight = '15px';
            nameDiv.textContent = name;

            const statusDiv = document.createElement('div');
            const record = dayData[index];

            if (currentTab === 'lesson') {
                statusDiv.textContent = (record && record.w) ? record.w : "---";
                statusDiv.style.fontSize = "0.9rem";
                statusDiv.style.color = "var(--accent-blue)";
            } else {
                const badge = document.createElement('span');
                const statusStr = record ? record.aS : "---";
                badge.textContent = statusStr;

                if (statusStr === 'حاضر') badge.className = 'status-badge present';
                else if (statusStr === 'غیر حاضر') badge.className = 'status-badge absent';
                else if (statusStr === 'رخصت') badge.className = 'status-badge leave';
                else badge.className = 'status-badge none';

                statusDiv.appendChild(badge);
            }

            row.appendChild(numDiv);
            row.appendChild(nameDiv);
            row.appendChild(statusDiv);
            listContainer.appendChild(row);
        });
    }

    window.onload = function() {
        initDatePicker();
        loadDataForDate();
    };

</body>
</html>
