<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مسجد سبق اور ماہانہ نمبر</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @font-face {
      font-family: 'JameelNoori';
      src: url('Jameel%20Noori%20Nastaleeq%202.ttf') format('truetype'),
           url('Jameel Noori Nastaleeq 2.ttf') format('truetype'),
           local('Jameel Noori Nastaleeq');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JameelNoori', 'Noto Nastaliq Urdu', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* ہلکا دھندلا لوڈنگ اسکرین (جب تک جمیل نوری فونٹ لوڈ ہو) */
    .font-loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(22, 6, 44, 0.78);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 9999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .font-loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 215, 0, 0.25);
      border-top-color: #ffd700;
      border-right-color: #00f2fe;
      border-radius: 50%;
      animation: loaderSpin 0.85s linear infinite;
    }

    .loader-text {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: #ffe57f;
      direction: ltr;
    }

    @keyframes loaderSpin {
      to { transform: rotate(360deg); }
    }

    .score-num {
      font-family: 'Arial Black', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
      font-weight: 900 !important;
      direction: ltr;
      unicode-bidi: isolate;
      letter-spacing: 0.5px;
      line-height: 1.05;
    }

    .sharp-gold-shine {
      font-family: 'Arial Black', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
      font-weight: 900 !important;
      direction: ltr;
      unicode-bidi: isolate;
      line-height: 1;
      background-image: linear-gradient(
        115deg,
        #c87d00 0%,
        #ffd700 24%,
        #fff7b2 40%,
        #ffffff 47%,
        #ffd700 55%,
        #b56900 74%,
        #ffe45e 90%,
        #c87d00 100%
      );
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #ffd700;
      filter: none !important;
      text-shadow: none !important;
      animation: crispGoldSweep 2.6s linear infinite;
    }

    @keyframes crispGoldSweep {
      0% { background-position: 100% 50%; }
      100% { background-position: -120% 50%; }
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1b0638 0%, #430d73 45%, #9b145a 85%, #d93b20 100%);
      background-attachment: fixed;
      color: #fff;
      padding: 10px 10px 80px 10px;
      line-height: 1.95;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* اسکرین پر محفوظ ہونے کا واضح میسج */
    .toast-banner {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-130%);
      background: linear-gradient(135deg, #00b09b 0%, #38ef7d 100%);
      color: #042114;
      font-size: 1.32rem;
      font-weight: bold;
      padding: 8px 22px;
      border-radius: 30px;
      border: 2px solid #ffffff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      z-index: 2000;
      white-space: nowrap;
      transition: transform 0.25s ease;
    }

    .toast-banner.error {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: #ffffff;
    }

    .toast-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    /* مسجد بینر سیکشن */
    .banner-wrapper {
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 215, 0, 0.65);
      border-radius: 20px;
      padding: 8px;
      margin-bottom: 11px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
    }

    .active-banner-box {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: linear-gradient(135deg, #2b094c, #140529);
      min-height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .active-banner-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .mosque-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .thumb-btn {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background: #1a0633;
      cursor: pointer;
      height: 54px;
      opacity: 0.62;
      transition: all 0.2s ease;
      padding: 0;
    }

    .thumb-btn.active {
      opacity: 1;
      border: 2.5px solid #ffd200;
      box-shadow: 0 0 14px rgba(255, 210, 0, 0.55);
      transform: scale(1.01);
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* مہینے اور سال کی بڑی سرخی اور سلیکٹر */
    .month-hero-card {
      background: linear-gradient(135deg, rgba(24, 6, 48, 0.88), rgba(66, 14, 102, 0.88));
      border: 2px solid rgba(255, 215, 0, 0.65);
      border-radius: 18px;
      padding: 10px 14px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .month-big-title {
      font-size: 2.35rem;
      font-weight: bold;
      line-height: 1.65;
      color: #ffd700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    }

    .month-sub-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .month-select {
      flex: 1;
      max-width: 260px;
      min-height: 42px;
      padding: 2px 12px;
      font-size: 1.22rem;
      line-height: 1.8;
      border-radius: 12px;
      border: 1.5px solid #00f2fe;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }

    .month-select option {
      background: #240842;
      color: #fff;
    }

    /* بنیادی بٹن */
    .btn {
      border: none;
      border-radius: 12px;
      padding: 5px 14px;
      font-size: 1.18rem;
      line-height: 1.85;
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
    }

    .btn:active { transform: scale(0.96); }

    /* ایڈمن ایکشن بٹن: کلاس شامل کریں + آن لائن بھیجیں + پرنٹ */
    .admin-top-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn-add-class {
      width: 100%;
      background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
      color: #062114;
      font-size: 1.22rem;
      font-weight: bold;
      border-radius: 14px;
      padding: 5px 10px;
    }

    .btn-sync-online {
      width: 100%;
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
      color: #ffffff;
      font-size: 1.22rem;
      font-weight: bold;
      border-radius: 14px;
      padding: 5px 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
    }

    .btn-print {
      grid-column: span 2;
      width: 100%;
      background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
      color: #240b36;
      font-size: 1.24rem;
      font-weight: bold;
      border-radius: 14px;
      padding: 4px 12px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
      color: #240b36;
      font-weight: bold;
    }

    .btn-icon {
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 2px 10px;
      font-size: 1rem;
      border-radius: 9px;
    }

    .btn-del {
      background: rgba(239, 68, 68, 0.88);
      padding: 2px 10px;
      font-size: 1rem;
      border-radius: 9px;
    }

    /* کلاس کارڈ */
    .class-card {
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 13px;
      margin-bottom: 18px;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .class-header {
      background: linear-gradient(90deg, #ff00cc 0%, #333399 100%);
      border-radius: 14px;
      padding: 7px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 11px;
    }

    .class-title {
      font-size: 1.5rem;
      font-weight: bold;
    }

    /* ٹاپ 3 ونرز کارڈ */
    .winner-box {
      background: linear-gradient(135deg, #ffd200 0%, #ff8c00 50%, #ff3d54 100%);
      border-radius: 16px;
      padding: 9px;
      margin-bottom: 13px;
      border: 2px solid #fff5b8;
      box-shadow: 0 6px 20px rgba(255, 140, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .winner-item {
      background: rgba(20, 4, 40, 0.97);
      border: 1.5px solid rgba(255, 215, 0, 0.75);
      border-radius: 14px;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .winner-left-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .winner-pos-stylish {
      font-family: 'Georgia', 'Palatino Linotype', 'Times New Roman', serif !important;
      font-style: italic;
      font-weight: 900;
      direction: ltr;
      unicode-bidi: isolate;
      font-size: 1.7rem;
      line-height: 1;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      padding-bottom: 2px;
      filter: none !important;
    }

    .winner-pos-stylish sup {
      font-size: 0.98rem;
      font-style: italic;
      margin-left: 1px;
      vertical-align: super;
    }

    .pos-1 {
      background: linear-gradient(180deg, #fffde7 0%, #ffd700 55%, #d48806 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pos-2 {
      background: linear-gradient(180deg, #ffffff 0%, #cfd8dc 55%, #90a4ae 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pos-3 {
      background: linear-gradient(180deg, #ffe0b2 0%, #ffab40 55%, #e65100 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .winner-name-side {
      font-size: 2.55rem;
      font-weight: bold;
      line-height: 1.72;
      color: #ffffff;
      word-break: break-word;
    }

    .winner-pts-bare {
      font-size: 3.65rem;
      padding-left: 2px;
      flex-shrink: 0;
    }

    /* نگران بچہ (مانیٹر) کارڈ */
    .monitor-card {
      background: linear-gradient(145deg, rgba(22, 11, 52, 0.95), rgba(49, 15, 84, 0.95));
      border-radius: 16px;
      padding: 11px;
      margin-bottom: 12px;
      border: 1.5px solid #a855f7;
    }

    .monitor-card.top-monitor {
      border: 2.5px solid #ffd200;
      box-shadow: 0 5px 18px rgba(255, 210, 0, 0.28);
    }

    .monitor-top {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: #052417;
      border-radius: 12px;
      padding: 7px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .monitor-card.top-monitor .monitor-top {
      background: linear-gradient(135deg, #ffe259 0%, #ffa751 100%);
      color: #240830;
    }

    .monitor-name-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .monitor-serial-num {
      background: #140529;
      color: #ffd200;
      min-width: 30px;
      height: 30px;
      padding: 0 8px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .monitor-name {
      font-size: 1.55rem;
      font-weight: bold;
      line-height: 1.65;
    }

    .monitor-total-bare {
      color: #140529;
      font-size: 1.85rem;
      padding-right: 4px;
    }

    /* دیئے گئے بچوں (بچوں کے بچے) کی فہرست */
    .student-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .student-row {
      background: rgba(255, 255, 255, 0.11);
      border-radius: 14px;
      padding: 9px 14px;
      border-right: 5px solid #38ef7d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .student-info-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      flex: 1;
    }

    .student-name {
      font-size: 1.52rem;
      font-weight: bold;
      line-height: 1.65;
      color: #fff;
    }

    .student-btns-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pts-btn {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #06182c;
      border: none;
      border-radius: 10px;
      padding: 1px 13px;
      font-size: 1.12rem;
      font-weight: bold;
      cursor: pointer;
    }

    .pts-btn:active { transform: scale(0.95); }

    .student-score-bare {
      color: #ffffff;
      font-size: 2.45rem;
      padding: 4px 8px;
      text-align: center;
      flex-shrink: 0;
    }

    .student-score-bare.editable { cursor: pointer; }
    .student-score-bare.editable:active { transform: scale(0.93); }

    .empty-text {
      text-align: center;
      padding: 10px;
      font-size: 1.18rem;
      color: rgba(255, 255, 255, 0.82);
    }

    /* نیچے ایڈمن لاگ ان / سٹیٹس پٹی */
    .admin-footer {
      margin-top: 22px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .admin-trigger-btn {
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: rgba(255, 255, 255, 0.88);
      border-radius: 20px;
      padding: 3px 16px;
      font-size: 1.08rem;
      cursor: pointer;
    }

    .sync-badge {
      font-size: 1rem;
      color: #38ef7d;
      background: rgba(0, 0, 0, 0.38);
      padding: 2px 12px;
      border-radius: 20px;
    }

    /* ماڈل باکس */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 2, 24, 0.84);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(145deg, #2b094c, #59116e);
      border: 2px solid #ffd200;
      border-radius: 20px;
      padding: 18px;
    }

    .modal-title {
      font-size: 1.38rem;
      font-weight: bold;
      color: #ffd200;
      margin-bottom: 10px;
    }

    .modal-input {
      width: 100%;
      padding: 8px 13px;
      font-size: 1.35rem;
      line-height: 1.85;
      border-radius: 12px;
      border: 2px solid #00f2fe;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      margin-bottom: 12px;
      outline: none;
    }

    .auth-input {
      direction: ltr;
      font-family: Tahoma, Arial, sans-serif;
      font-size: 1.05rem;
      line-height: 1.5;
      padding: 10px 13px;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* نیچے گنتی والا کی بورڈ */
    .keypad-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 2, 20, 0.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .keypad-overlay.show { display: flex; }

    .keypad-sheet {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(160deg, #1e073b 0%, #3d0e66 60%, #191345 100%);
      border-top: 3px solid #ffd200;
      border-radius: 24px 24px 0 0;
      padding: 13px 13px 18px 13px;
    }

    .kp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .kp-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: #ffd200;
    }

    .kp-close {
      background: rgba(255, 255, 255, 0.16);
      border: none;
      color: #fff;
      border-radius: 9px;
      padding: 2px 11px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .kp-display {
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid #00f2fe;
      border-radius: 14px;
      padding: 7px 12px;
      margin-bottom: 9px;
    }

    .kp-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.15rem;
    }

    .kp-expr { font-size: 1.35rem; color: #38ef7d; }
    .kp-total { font-size: 1.75rem; color: #ffd200; }

    .kp-modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 9px;
    }

    .kp-mode {
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 3px;
      font-size: 1.15rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
    }

    .kp-mode.add-on { background: linear-gradient(135deg, #11998e, #38ef7d); color: #052216; }
    .kp-mode.sub-on { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: #fff; }

    .kp-grid {
      direction: ltr;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .kp-key {
      border: none;
      border-radius: 12px;
      padding: 11px 4px;
      font-family: 'Arial Black', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      background: rgba(255, 255, 255, 0.16);
      cursor: pointer;
    }

    .kp-key:active { transform: scale(0.94); }
    .kp-plus { background: linear-gradient(135deg, #00c6ff, #0072ff); }
    .kp-back { background: linear-gradient(135deg, #f7971e, #ffd200); color: #240b36; }
    .kp-clr  { background: linear-gradient(135deg, #cb2d3e, #ef473a); font-family: 'JameelNoori', Tahoma, sans-serif; font-size: 1.2rem; }
    .kp-save { grid-column: span 2; background: linear-gradient(135deg, #11998e, #38ef7d); color: #052216; font-family: 'JameelNoori', Tahoma, sans-serif; font-size: 1.4rem; }

    /* =========================================================
       پرنٹ (A4 / PDF) کے لیے صاف اور واضح ڈیزائن
       ========================================================= */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
      }
      .font-loader-overlay,
      .toast-banner,
      .mosque-switcher,
      .month-sub-row,
      #adminTopBar,
      .student-btns-row,
      .btn,
      .admin-footer,
      .modal-overlay,
      .keypad-overlay {
        display: none !important;
      }
      .container {
        max-width: 100% !important;
      }
      .banner-wrapper {
        background: #ffffff !important;
        border: 1.5px solid #000 !important;
        box-shadow: none !important;
        padding: 4px !important;
      }
      .month-hero-card {
        background: #f3f4f6 !important;
        border: 1.5px solid #000 !important;
        box-shadow: none !important;
      }
      .month-big-title {
        color: #000000 !important;

<script>
  const SUPABASE_URL = 'https://fetygtmtqufoamyumjjy.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_wpRuG6Un5k4bDjLYEIjqng_yFUt79Q1';
  const ADMIN_EMAIL = 'tulabaedhanda@gmail.com';
  const TABLE_NAME = 'masjid_sabaq_board';
  const ROW_ID = 'main';

  const sb = (window.supabase && SUPABASE_URL.startsWith('https://'))
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          storageKey: 'masjid_sabaq_separate_auth_v1',
          persistSession: true,
          autoRefreshToken: true
        }
      })
    : null;

  let currentUser = null;
  let syncStatusText = '';

  function isAdmin() {
    if (!sb) return false;
    return Boolean(
      currentUser &&
      currentUser.email &&
      currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
    );
  }

  // =========================================================
  // 1. رضوان مسجد پہلے، امام حسین مسجد دوسرے نمبر پر (نئے ڈرائیو لنکس اوپر نیچے کر دیے گئے ہیں)
  // =========================================================
  const MOSQUES_CONFIG = [
    {
      id: 'mosque_2',
      label: 'رضوان مسجد',
      driveId: '18UcaX2RmQbMbZOMlNOFlxAO_ImmNGeDc'
    },
    {
      id: 'mosque_1',
      label: 'امام حسین مسجد',
      driveId: '1hk9-Mbrl0Xc9Jg799XCt1XZFzG1fBw7A'
    }
  ];

  function getBannerPrimaryUrl(driveId) {
    return `https://lh3.googleusercontent.com/d/${driveId}`;
  }

  function getBannerFallbackUrl(driveId) {
    return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1200`;
  }

  // کنفرمیشن میسج
  let toastTimer = null;
  function showToast(msg, isError = false) {
    const el = document.getElementById('toastBanner');
    el.textContent = msg;
    el.className = 'toast-banner show' + (isError ? ' error' : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      el.classList.remove('show');
    }, 3200);
  }

  // پرنٹ فنکشن
  function printRecord() {
    window.print();
  }

  const STORAGE_KEY = 'masjid_nigrans_monthly_v1';
  const OLD_STORAGE_KEY = 'masjid_nigrans_v1';

  function cleanNum(num) {
    return Math.round((Number(num) + Number.EPSILON) * 1000) / 1000;
  }

  function getStylishOrdinalHtml(index) {
    if (index === 0) return '1<sup>st</sup>';
    if (index === 1) return '2<sup>nd</sup>';
    return '3<sup>rd</sup>';
  }

  const URDU_MONTHS = [
    'جنوری', 'فروری', 'مارچ', 'اپریل', 'مئی', 'جون',
    'جولائی', 'اگست', 'ستمبر', 'اکتوبر', 'نومبر', 'دسمبر'
  ];

  // موجودہ کیلنڈر مہینہ اور سال معلوم کرنے کا فنکشن
  function getCurrentCalendarMonth() {
    const now = new Date();
    const year = now.getFullYear();
    const mIdx = now.getMonth();
    return {
      id: `m_${year}_${mIdx + 1}`,
      name: `${URDU_MONTHS[mIdx]} ${year}`
    };
  }

  function cloneClassesWithZeroPoints(sourceClasses) {
    if (!Array.isArray(sourceClasses)) return [];
    const stamp = Date.now();
    return sourceClasses.map((cls, ci) => ({
      id: `c_${stamp}_${ci}_${Math.floor(Math.random() * 1000)}`,
      name: cls.name,
      monitors: (cls.monitors || []).map((mon, mi) => ({
        id: `m_${stamp}_${ci}_${mi}_${Math.floor(Math.random() * 1000)}`,
        name: mon.name,
        students: (mon.students || []).map((st, si) => ({
          id: `s_${stamp}_${ci}_${mi}_${si}_${Math.floor(Math.random() * 1000)}`,
          name: st.name,
          points: 0
        }))
      }))
    }));
  }

  // نیا مہینہ چڑھنے پر خودکار نیا مہینہ بنانا (نام برقرار، پوائنٹس 0، پچھلا ریکارڈ محفوظ)
  function ensureCurrentMonthReady(dataObj, forceSelectCurrent = false) {
    const curr = getCurrentCalendarMonth();
    let createdNew = false;

    if (!Array.isArray(dataObj.months)) dataObj.months = [];
    if (!dataObj.monthlyRecords) dataObj.monthlyRecords = {};

    const alreadyExists = dataObj.months.some(m => m.id === curr.id);
    if (!alreadyExists) {
      const latestMonth = dataObj.months.length > 0
        ? dataObj.months[dataObj.months.length - 1]
        : null;
      const prevRec = latestMonth && dataObj.monthlyRecords[latestMonth.id]
        ? dataObj.monthlyRecords[latestMonth.id]
        : { mosque_2: [], mosque_1: [] };

      dataObj.months.push({ id: curr.id, name: curr.name });
      dataObj.monthlyRecords[curr.id] = {
        mosque_2: cloneClassesWithZeroPoints(prevRec.mosque_2),
        mosque_1: cloneClassesWithZeroPoints(prevRec.mosque_1)
      };
      createdNew = true;
    }

    if (forceSelectCurrent || !dataObj.activeMonthId) {
      dataObj.activeMonthId = curr.id;
    }

    return createdNew;
  }

  const initialCurr = getCurrentCalendarMonth();
  let appData = {
    activeMosqueId: 'mosque_2',
    activeMonthId: initialCurr.id,
    months: [
      { id: initialCurr.id, name: initialCurr.name }
    ],
    monthlyRecords: {
      [initialCurr.id]: {
        mosque_2: [],
        mosque_1: []
      }
    }
  };

  function normalizeAppData(raw) {
    if (!raw || typeof raw !== 'object') return null;

    let normalized = null;
    if (raw.monthlyRecords && Array.isArray(raw.months) && raw.months.length > 0) {
      normalized = {
        activeMosqueId: raw.activeMosqueId === 'mosque_1' ? 'mosque_1' : 'mosque_2',
        activeMonthId: raw.activeMonthId,
        months: [...raw.months],
        monthlyRecords: { ...raw.monthlyRecords }
      };
    } else if (raw.records) {
      const curr = getCurrentCalendarMonth();
      normalized = {
        activeMosqueId: 'mosque_2',
        activeMonthId: curr.id,
        months: [{ id: curr.id, name: curr.name }],
        monthlyRecords: {
          [curr.id]: {
            mosque_2: Array.isArray(raw.records.mosque_2) ? raw.records.mosque_2 : [],
            mosque_1: Array.isArray(raw.records.mosque_1) ? raw.records.mosque_1 : []
          }
        }
      };
    }

    if (normalized) {
      ensureCurrentMonthReady(normalized, false);
    }
    return normalized;
  }

  function loadLocalCache() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(OLD_STORAGE_KEY);
      if (saved) {
        const parsed = normalizeAppData(JSON.parse(saved));
        if (parsed) {
          ensureCurrentMonthReady(parsed, true);
          appData = parsed;
        }
      }
    } catch (e) {
      console.error(e);
    }
  }

  function saveLocalCache() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    } catch (e) {
      console.error(e);
    }
  }

  function hasAnyData(dataObj) {
    if (!dataObj || !dataObj.monthlyRecords) return false;
    return Object.values(dataObj.monthlyRecords).some(mRec => {
      const c1 = Array.isArray(mRec?.mosque_1) ? mRec.mosque_1.length : 0;
      const c2 = Array.isArray(mRec?.mosque_2) ? mRec.mosque_2.length : 0;
      return (c1 + c2) > 0;
    });
  }

  // Supabase سے لائیو ریکارڈ لوڈ کرنا
  async function fetchCloudData(isInitialLoad = false) {
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from(TABLE_NAME)
        .select('data')
        .eq('id', ROW_ID)
        .single();

      if (!error && data && data.data) {
        const cloudNormalized = normalizeAppData(data.data);
        if (!cloudNormalized) return;

        const cloudHas = hasAnyData(cloudNormalized);
        const localHas = hasAnyData(appData);

        if (!cloudHas && localHas) {
          if (isAdmin()) {
            await saveData(false);
          }
          return;
        }

        const autoRolledNewMonth = ensureCurrentMonthReady(cloudNormalized, isInitialLoad);
        const keepMosque = appData.activeMosqueId || 'mosque_2';
        const curr = getCurrentCalendarMonth();

        const targetMonth = isInitialLoad
          ? curr.id
          : (cloudNormalized.months.some(m => m.id === appData.activeMonthId)
              ? appData.activeMonthId
              : curr.id);

        appData = {
          activeMosqueId: keepMosque,
          activeMonthId: targetMonth,
          months: cloudNormalized.months,
          monthlyRecords: cloudNormalized.monthlyRecords
        };
        saveLocalCache();
        render();

        if (autoRolledNewMonth && isAdmin()) {
          await saveData(false);
        }
      }
    } catch (err) {
      console.error('Cloud fetch error:', err);
    }
  }

  // Supabase پر ریکارڈ محفوظ کرنا
  async function saveData(showSuccessToast = true) {
    saveLocalCache();
    if (!sb || !isAdmin()) return;

    syncStatusText = 'آن لائن بھیجا جا رہا ہے...';
    renderFooter();

    try {
      const { error } = await sb
        .from(TABLE_NAME)
        .upsert({
          id: ROW_ID,
          data: {
            activeMosqueId: appData.activeMosqueId,
            activeMonthId: appData.activeMonthId,
            months: appData.months,
            monthlyRecords: appData.monthlyRecords
          },
          updated_at: new Date().toISOString()
        });

      if (error) {
        syncStatusText = 'محفوظ کرنے میں خرابی!';
        showToast('❌ ڈیٹا محفوظ نہیں ہو سکا، دوبارہ کوشش کریں!', true);
      } else {
        syncStatusText = 'لائیو محفوظ ہو گیا ✓';
        if (showSuccessToast) {
          showToast('✅ ڈیٹا آن لائن محفوظ ہو گیا ہے!');
        }
      }
    } catch (err) {
      syncStatusText = 'انٹرنیٹ خرابی!';
      showToast('❌ انٹرنیٹ کنکشن چیک کریں!', true);
    }
    renderFooter();
  }

  async function manualPushOnline() {
    if (!isAdmin()) return;
    const btn = document.getElementById('manualSyncBtn');
    if (btn) {
      btn.textContent = '⏳ بھیجا جا رہا ہے...';
      btn.disabled = true;
    }
    await saveData(true);
    if (btn) {
      btn.textContent = '☁️ ڈیٹا آن لائن بھیجیں';
      btn.disabled = false;
    }
  }

  function getActiveClasses() {
    if (!appData.monthlyRecords[appData.activeMonthId]) {
      appData.monthlyRecords[appData.activeMonthId] = { mosque_2: [], mosque_1: [] };
    }
    if (!appData.monthlyRecords[appData.activeMonthId][appData.activeMosqueId]) {
      appData.monthlyRecords[appData.activeMonthId][appData.activeMosqueId] = [];
    }
    return appData.monthlyRecords[appData.activeMonthId][appData.activeMosqueId];
  }

  function switchMosque(mosqueId) {
    appData.activeMosqueId = mosqueId;
    saveLocalCache();
    render();
  }

  function switchMonth(monthId) {
    appData.activeMonthId = monthId;
    saveLocalCache();
    render();
  }

  // =========================================================
  // 2. ایڈمن لاگ ان / لاگ آؤٹ
  // =========================================================
  function openLoginModal() {
    document.getElementById('loginError').style.display = 'none';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginModal').classList.add('show');
    setTimeout(() => document.getElementById('loginPassword').focus(), 60);
  }

  function closeLoginModal() {
    document.getElementById('loginModal').classList.remove('show');
  }

  async function handleAdminLogin(e) {
    e.preventDefault();
    if (!sb) return;
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginSubmitBtn');
    const errBox = document.getElementById('loginError');

    if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
      errBox.textContent = 'صرف مجاز ایڈمن ای میل سے لاگ ان کی اجازت ہے۔';
      errBox.style.display = 'block';
      return;
    }

    btn.textContent = 'لاگ ان ہو رہا ہے...';
    btn.disabled = true;
    errBox.style.display = 'none';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    btn.textContent = 'لاگ ان کریں';
    btn.disabled = false;

    if (error) {
      errBox.textContent = 'ای میل یا پاس ورڈ غلط ہے۔';
      errBox.style.display = 'block';
      return;
    }

    currentUser = data.user;
    closeLoginModal();
    await fetchCloudData(false);
    render();
  }

  async function handleAdminLogout() {
    if (!sb) return;
    await sb.auth.signOut();
    currentUser = null;
    syncStatusText = '';
    render();
  }

  // =========================================================
  // 3. نام درج کرنے والا ماڈل
  // =========================================================
  let modalCallback = null;

  function openModal({ title, placeholder = '', defaultValue = '', onSave }) {
    if (!isAdmin()) return;
    document.getElementById('modalTitle').textContent = title;
    const inp = document.getElementById('modalInput');
    inp.placeholder = placeholder;
    inp.value = defaultValue;
    modalCallback = onSave;
    document.getElementById('inputModal').classList.add('show');
    setTimeout(() => inp.focus(), 60);
  }

  function closeModal() {
    document.getElementById('inputModal').classList.remove('show');
    modalCallback = null;
  }

  function submitModal(e) {
    if (e) e.preventDefault();
    const val = document.getElementById('modalInput').value.trim();
    const cb = modalCallback;
    closeModal();
    if (cb && val) cb(val);
  }

  // =========================================================
  // 4. کلاس، نگران بچہ، اور دیئے گئے بچے (صرف منتخب مہینے میں تبدیلی ہوگی)
  // =========================================================
  function openAddClass() {
    if (!isAdmin()) return;
    const classes = getActiveClasses();
    openModal({
      title: 'کلاس کا نام لکھیں',
      placeholder: `مثلاً: کلاس ${classes.length + 1}`,
      onSave: (name) => {
        classes.push({
          id: 'c_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          name,
          monitors: []
        });
        saveData(true);
        render();
      }
    });
  }

  function renameClass(classId) {
    if (!isAdmin()) return;
    const cls = getActiveClasses().find(c => c.id === classId);
    if (!cls) return;
    openModal({
      title: 'کلاس کا نام بدلیں',
      defaultValue: cls.name,
      onSave: (name) => {
        cls.name = name;
        saveData(true);
        render();
      }
    });
  }

  function deleteClass(classId) {
    if (!isAdmin()) return;
    if (!confirm('کیا آپ اس کلاس کو حذف کرنا چاہتے ہیں؟')) return;
    appData.monthlyRecords[appData.activeMonthId][appData.activeMosqueId] =
      getActiveClasses().filter(c => c.id !== classId);
    saveData(true);
    render();
  }

  function openAddMonitor(classId) {
    if (!isAdmin()) return;
    const cls = getActiveClasses().find(c => c.id === classId);
    if (!cls) return;
    openModal({
      title: `${cls.name} میں نگران بچے کا نام`,
      placeholder: 'نگران بچے کا نام لکھیں...',
      onSave: (name) => {
        cls.monitors.push({
          id: 'm_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          name,
          students: []
        });
        saveData(true);
        render();
      }
    });
  }

  function renameMonitor(classId, monitorId) {
    if (!isAdmin()) return;
    const cls = getActiveClasses().find(c => c.id === classId);
    const mon = cls?.monitors.find(m => m.id === monitorId);
    if (!mon) return;
    openModal({
      title: 'نگران بچے کا نام بدلیں',
      defaultValue: mon.name,
      onSave: (name) => {
        mon.name = name;
        saveData(true);
        render();
      }
    });
  }

  function deleteMonitor(classId, monitorId) {
    if (!isAdmin()) return;
    const cls = getActiveClasses().find(c => c.id === classId);
    if (!cls) return;
    if (!confirm('کیا آپ اس نگران بچے اور اس کے گروپ کو حذف کرنا چاہتے ہیں؟')) return;
    cls.monitors = cls.monitors.filter(m => m.id !== monitorId);
    saveData(true);
    render();
  }

  function openAddStudent(classId, monitorId) {
    if (!isAdmin()) return;
    const cls = getActiveClasses().find(c => c.id === classId);
    const mon = cls?.monitors.find(m => m.id === monitorId);
    if (!mon) return;
    openModal({
      title: `${mon.name} کو دیا جانے والا بچہ`,
      placeholder: 'بچے کا نام لکھیں...',
      onSave: (name) => {
        mon.students.push({
          id: 's_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
          name,
          points: 0
        });
        saveData(true);
        render();
      }
    });
  }

  function renameStudent(classId, monitorId, studentId) {
    if (!isAdmin()) return;
    const cls = getActiveClasses().find(c => c.id === classId);
    const mon = cls?.monitors.find(m => m.id === monitorId);
    const st = mon?.students.find(s => s.id === studentId);
    if (!st) return;
    openModal({
      title: 'بچے کا نام بدلیں',
      defaultValue: st.name,
      onSave: (name) => {
        st.name = name;
        saveData(true);
        render();
      }
    });
  }

  function deleteStudent(classId, monitorId, studentId) {
    if (!isAdmin()) return;
    const cls = getActiveClasses().find(c => c.id === classId);
    const mon = cls?.monitors.find(m => m.id === monitorId);
    if (!mon) return;
    if (!confirm('کیا آپ اس بچے کو نکالنا چاہتے ہیں؟')) return;
    mon.students = mon.students.filter(s => s.id !== studentId);
    saveData(true);
    render();
  }

  // =========================================================
  // 5. نیچے گنتی والا کی بورڈ
  // =========================================================
  let kpTarget = null;
  let kpMode = 'add';
  let kpTokens = [''];

  function openKeypad(classId, monitorId, studentId) {
    if (!isAdmin()) return;
    const cls = getActiveClasses().find(c => c.id === classId);
    const mon = cls?.monitors.find(m => m.id === monitorId);
    const st = mon?.students.find(s => s.id === studentId);
    if (!st) return;

    kpTarget = { classId, monitorId, studentId, base: cleanNum(st.points || 0) };
    kpMode = 'add';
    kpTokens = [''];
    document.getElementById('kpStudentName').textContent = st.name;
    updateKpScreen();
    document.getElementById('keypadOverlay').classList.add('show');
  }

  function closeKeypad() {
    document.getElementById('keypadOverlay').classList.remove('show');
    kpTarget = null;
  }

  function setKpMode(m) {
    kpMode = m;
    updateKpScreen();
  }

  function kpDigit(d) {
    let curr = kpTokens[kpTokens.length - 1];
    curr = curr === '0' ? d : (curr.length < 7 ? curr + d : curr);
    kpTokens[kpTokens.length - 1] = curr;
    updateKpScreen();
  }

  function kpDot() {
    let curr = kpTokens[kpTokens.length - 1];
    if (curr.includes('.')) return;
    kpTokens[kpTokens.length - 1] = curr === '' ? '0.' : curr + '.';
    updateKpScreen();
  }

  function kpPlus() {
    const curr = kpTokens[kpTokens.length - 1];
    if (curr === '' || curr === '0.') return;
    kpTokens.push('');
    updateKpScreen();
  }

  function kpBack() {
    let curr = kpTokens[kpTokens.length - 1];
    if (curr.length > 0) {
      kpTokens[kpTokens.length - 1] = curr.slice(0, -1);
    } else if (kpTokens.length > 1) {
      kpTokens.pop();
    }
    updateKpScreen();
  }

  function kpClear() {
    kpTokens = [''];
    updateKpScreen();
  }

  function getKpSum() {
    return kpTokens.reduce((acc, t) => {
      const n = parseFloat(t);
      return isNaN(n) ? acc : cleanNum(acc + n);
    }, 0);
  }

  function updateKpScreen() {
    if (!kpTarget) return;
    const entered = getKpSum();
    const nextTotal = kpMode === 'add'
      ? cleanNum(kpTarget.base + entered)
      : Math.max(0, cleanNum(kpTarget.base - entered));

    document.getElementById('kpBase').textContent = kpTarget.base;
    const expr = kpTokens.map(t => (t === '' ? '0' : t)).join(' + ');
    const sign = kpMode === 'add' ? '+' : '-';
    document.getElementById('kpExpr').textContent =
      kpTokens.length > 1 ? `${sign} (${expr} = ${entered})` : `${sign} ${expr}`;
    document.getElementById('kpTotal').textContent = nextTotal;

    document.getElementById('btnModeAdd').className = 'kp-mode' + (kpMode === 'add' ? ' add-on' : '');
    document.getElementById('btnModeSub').className = 'kp-mode' + (kpMode === 'sub' ? ' sub-on' : '');
  }

  function kpSave() {
    if (!kpTarget || !isAdmin()) return;
    const cls = getActiveClasses().find(c => c.id === kpTarget.classId);
    const mon = cls?.monitors.find(m => m.id === kpTarget.monitorId);
    const st = mon?.students.find(s => s.id === kpTarget.studentId);
    if (!st) return;

    const entered = getKpSum();
    st.points = kpMode === 'add'
      ? cleanNum((st.points || 0) + entered)
      : Math.max(0, cleanNum((st.points || 0) - entered));

    saveData(true);
    closeKeypad();
    render();
  }

  function getMonitorTotal(monitor) {
    return cleanNum(
      (monitor.students || []).reduce((sum, st) => sum + cleanNum(st.points || 0), 0)
    );
  }

  function renderFooter() {
    const footer = document.getElementById('adminFooter');
    if (isAdmin()) {
      footer.innerHTML = `
        ${syncStatusText ? `<span class="sync-badge">${syncStatusText}</span>` : ''}
        <button type="button" class="admin-trigger-btn" onclick="handleAdminLogout()">🚪 لاگ آؤٹ</button>
      `;
    } else {
      footer.innerHTML = `
        <button type="button" class="admin-trigger-btn" onclick="openLoginModal()">🔐 ایڈمن لاگ ان</button>
      `;
    }
  }

  function render() {
    const admin = isAdmin();
    const activeMosque = MOSQUES_CONFIG.find(m => m.id === appData.activeMosqueId) || MOSQUES_CONFIG[0];
    const activeMonthObj = appData.months.find(m => m.id === appData.activeMonthId)
      || appData.months[appData.months.length - 1];

    // 1. فعال مسجد کا بڑا بینر
    document.getElementById('activeBannerBox').innerHTML = `
      <img
        class="active-banner-img"
        src="${getBannerPrimaryUrl(activeMosque.driveId)}"
        onerror="this.onerror=null; this.src='${getBannerFallbackUrl(activeMosque.driveId)}';"
        alt="${activeMosque.label}"
      />
    `;

    // 2. دونوں مسجدوں کے بینر سوئچر (رضوان مسجد پہلے)
    document.getElementById('mosqueSwitcher').innerHTML = MOSQUES_CONFIG.map(m => `
      <button type="button" class="thumb-btn ${m.id === activeMosque.id ? 'active' : ''}" onclick="switchMosque('${m.id}')">
        <img
          src="${getBannerPrimaryUrl(m.driveId)}"
          onerror="this.onerror=null; this.src='${getBannerFallbackUrl(m.driveId)}';"
          alt="${m.label}"
        />
      </button>
    `).join('');

    // 3. اوپر مہینے اور سال کا بڑا عنوان + پچھلا مہینہ دیکھنے کا سلیکٹر
    const monthHeroCard = document.getElementById('monthHeroCard');
    monthHeroCard.innerHTML = `
      <div class="month-big-title">${activeMonthObj ? activeMonthObj.name : ''}</div>
      ${appData.months.length > 1 ? `
        <div class="month-sub-row">
          <select class="month-select" onchange="switchMonth(this.value)">
            ${[...appData.months].reverse().map(m =>
              `<option value="${m.id}" ${m.id === appData.activeMonthId ? 'selected' : ''}>📅 ${m.name}</option>`
            ).join('')}
          </select>
        </div>
      ` : ''}
    `;

    // 4. ایڈمن بٹن صرف لاگ ان حالت میں دکھائیں
    document.getElementById('adminTopBar').style.display = admin ? 'block' : 'none';

    // 5. کلاسز، پوزیشنز، نگران بچے اور ان کے بچے
    const classes = getActiveClasses();
    const classesArea = document.getElementById('classesArea');

    if (classes.length === 0) {
      classesArea.innerHTML = `
        <div class="class-card">
          <div class="empty-text">${admin ? 'اس مہینے میں ابھی کوئی کلاس نہیں۔ اوپر <strong>"+ کلاس شامل کریں"</strong> دبا کر پہلی کلاس بنائیں۔' : 'ابھی ریکارڈ درج نہیں ہوا۔'}</div>
        </div>
      `;
      renderFooter();
      return;
    }

    classesArea.innerHTML = classes.map(cls => {
      const rankedMonitors = [...cls.monitors]
        .map(mon => ({
          ...mon,
          totalPoints: getMonitorTotal(mon)
        }))
        .sort((a, b) => b.totalPoints - a.totalPoints);

      const topMonitors = rankedMonitors.filter(m => m.totalPoints > 0).slice(0, 3);

      const winnerSectionHtml = topMonitors.length === 0
        ? ''
        : `<div class="winner-box">
            ${topMonitors.map((mon, idx) => `
              <div class="winner-item">
                <div class="winner-left-group">
                  <span class="winner-pos-stylish pos-${idx + 1}">${getStylishOrdinalHtml(idx)}</span>
                  <div class="winner-name-side">${mon.name}</div>
                </div>
                <div class="winner-pts-bare sharp-gold-shine">${mon.totalPoints}</div>
              </div>
            `).join('')}
          </div>`;

      const monitorsHtml = rankedMonitors.length === 0
        ? `<div class="empty-text">${admin ? 'اس کلاس میں ابھی کوئی نگران بچہ نہیں۔ اوپر "+ نگران بچہ" دبائیں۔' : 'ابھی کوئی اندراج موجود نہیں۔'}</div>`
        : rankedMonitors.map((mon, idx) => {
            const isWinner = idx === 0 && mon.totalPoints > 0;

            const studentsHtml = mon.students.length === 0
              ? `<div class="empty-text" style="padding:4px; font-size:1.1rem;">${admin ? 'ابھی کوئی بچہ نہیں دیا گیا۔ "+ بچہ دیں" دبائیں۔' : 'کوئی بچہ درج نہیں۔'}</div>`
              : mon.students.map(st => {
                  const pts = cleanNum(st.points || 0);
                  return `
                    <div class="student-row">
                      <div class="student-info-col">
                        <div class="student-name">${st.name}</div>
                        ${admin ? `
                          <div class="student-btns-row">
                            <button type="button" class="pts-btn" onclick="openKeypad('${cls.id}', '${mon.id}', '${st.id}')">+ نمبر</button>
                            <button type="button" class="btn btn-icon" onclick="renameStudent('${cls.id}', '${mon.id}', '${st.id}')">✏️</button>
                            <button type="button" class="btn btn-del" onclick="deleteStudent('${cls.id}', '${mon.id}', '${st.id}')">🗑️</button>
                          </div>
                        ` : ''}
                      </div>
                      <div class="student-score-bare score-num ${admin ? 'editable' : ''}" ${admin ? `onclick="openKeypad('${cls.id}', '${mon.id}', '${st.id}')"` : ''}>${pts}</div>
                    </div>
                  `;
                }).join('');

            return `
              <div class="monitor-card ${isWinner ? 'top-monitor' : ''}">
                <div class="monitor-top">
                  <div class="monitor-name-area">
                    <span class="monitor-serial-num score-num">${idx + 1}</span>
                    <span class="monitor-name">${mon.name}</span>
                    <span class="monitor-total-bare score-num">${mon.totalPoints}</span>
                  </div>
                  ${admin ? `
                    <div style="display:flex; gap:5px; align-items:center;">
                      <button type="button" class="btn btn-gold" style="padding:2px 10px; font-size:1.05rem;" onclick="openAddStudent('${cls.id}', '${mon.id}')">+ بچہ دیں</button>
                      <button type="button" class="btn btn-icon" onclick="renameMonitor('${cls.id}', '${mon.id}')">✏️</button>
                      <button type="button" class="btn btn-del" onclick="deleteMonitor('${cls.id}', '${mon.id}')">🗑️</button>
                    </div>
                  ` : ''}
                </div>
                <div class="student-list">
                  ${studentsHtml}
                </div>
              </div>
            `;
          }).join('');

      return `
        <div class="class-card">
          <div class="class-header">
            <div class="class-title">📚 ${cls.name}</div>
            ${admin ? `
              <div style="display:flex; gap:5px; align-items:center;">
                <button type="button" class="btn btn-gold" style="padding:2px 11px; font-size:1.08rem;" onclick="openAddMonitor('${cls.id}')">+ نگران بچہ</button>
                <button type="button" class="btn btn-icon" onclick="renameClass('${cls.id}')">✏️</button>
                <button type="button" class="btn btn-del" onclick="deleteClass('${cls.id}')">🗑️</button>
              </div>
            ` : ''}
          </div>

          ${winnerSectionHtml}
          ${monitorsHtml}
        </div>
      `;
    }).join('');

    renderFooter();
  }

  function hideFontLoader() {
    const loader = document.getElementById('fontLoader');
    if (loader) loader.classList.add('hidden');
  }

  async function initApp() {
    loadLocalCache();
    render();

    const fontReadyPromise = (document.fonts && document.fonts.ready)
      ? document.fonts.ready
      : Promise.resolve();

    const maxWaitTimeout = new Promise(resolve => setTimeout(resolve, 4000));

    const cloudInitPromise = (async () => {
      if (!sb) return;
      const { data } = await sb.auth.getSession();
      currentUser = data?.session?.user || null;
      render();

      sb.auth.onAuthStateChange((_event, session) => {
        currentUser = session?.user || null;
        render();
      });

      await fetchCloudData(true);

      sb.channel('masjid-board-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: TABLE_NAME }, () => {
          fetchCloudData(false);
        })
        .subscribe();

      // والدین کے موبائل پر ہر 10 سیکنڈ بعد خودکار تازہ ریکارڈ لوڈ ہو
      setInterval(() => fetchCloudData(false), 10000);
    })();

    // جمیل نوری فونٹ اور کلاؤڈ ڈیٹا لوڈ ہونے کے بعد لوڈنگ اسکرین ہٹائیں
    await Promise.race([
      Promise.allSettled([fontReadyPromise, cloudInitPromise]),
      maxWaitTimeout
    ]);
    hideFontLoader();
  }

  initApp();
</script>
</body>
</html>
